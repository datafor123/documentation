<svg xmlns="http://www.w3.org/2000/svg" width="700" height="476" viewBox="0 0 700 476" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Which date the AI Agent uses for a measure</title>
  <desc id="desc">The Agent takes the first of four sources. A date the question names always wins. Otherwise it uses the measure's Default time field, then the model's Default time dimension, from which it picks the field that fits the question's grain. With none of these, it judges which date the measure describes and the answer states that assumption. Separately, the time Semantic role or Convert type gives each Attribute its level type, which quick-measure time templates and relative dates use; it does not choose the Agent's date.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
  </defs>

  <rect width="700" height="476" fill="#FFFFFF"/>

  <!-- Ladder -->
  <rect x="20" y="14" width="420" height="78" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <circle cx="44" cy="40" r="13" fill="#1F4FD8"/>
  <text x="44" y="45" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="66" y="45" font-size="16" font-weight="700" fill="#1F4FD8">A date the question names</text>
  <text x="66" y="70" font-size="14" fill="#2B2B3A">"refunds by return date last month"</text>

  <rect x="20" y="126" width="420" height="78" rx="12" fill="#F3EFFF" stroke="#C9BBF2" stroke-width="1.5"/>
  <circle cx="44" cy="152" r="13" fill="#5B3FBF"/>
  <text x="44" y="157" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="66" y="157" font-size="16" font-weight="700" fill="#5B3FBF">The measure's Default time field</text>
  <text x="66" y="182" font-size="14" fill="#2B2B3A">Measure › Business semantics</text>

  <rect x="20" y="238" width="420" height="96" rx="12" fill="#EAF6EC" stroke="#9CCFA4" stroke-width="1.5"/>
  <circle cx="44" cy="264" r="13" fill="#2E7D32"/>
  <text x="44" y="269" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="66" y="269" font-size="16" font-weight="700" fill="#2E7D32">The model's Default time dimension</text>
  <text x="66" y="294" font-size="14" fill="#2B2B3A">Model properties; the Agent picks the field</text>
  <text x="66" y="314" font-size="14" fill="#2B2B3A">of that Dimension that fits the question</text>

  <rect x="20" y="368" width="420" height="96" rx="12" fill="#F5F6F8" stroke="#D5D9E0" stroke-width="1.5"/>
  <circle cx="44" cy="394" r="13" fill="#3B4252"/>
  <text x="44" y="399" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="66" y="399" font-size="16" font-weight="700" fill="#3B4252">No setting: the Agent judges</text>
  <text x="66" y="424" font-size="14" fill="#2B2B3A">which date the measure describes;</text>
  <text x="66" y="444" font-size="14" fill="#2B2B3A">the answer states the assumption</text>

  <!-- Side box -->
  <rect x="464" y="14" width="216" height="450" rx="12" fill="#FFF6E5" stroke="#F2C98A" stroke-width="1.5"/>
  <text x="480" y="42" font-size="16" font-weight="700" fill="#9A5B00">A separate setting</text>
  <text x="480" y="64" font-size="14" fill="#2B2B3A">It does not choose the</text>
  <text x="480" y="84" font-size="14" fill="#2B2B3A">Agent's date.</text>

  <rect x="478" y="102" width="188" height="74" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <text x="490" y="126" font-size="14" font-weight="700" fill="#2B2B3A">Semantic role</text>
  <text x="490" y="146" font-size="14" fill="#2B2B3A">or Convert type › Date</text>
  <text x="490" y="166" font-size="14" fill="#5B6472">on each Attribute</text>

  <rect x="478" y="210" width="188" height="74" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <text x="490" y="234" font-size="14" font-weight="700" fill="#2B2B3A">Level type</text>
  <text x="490" y="254" font-size="14" fill="#2B2B3A">Year, Quarter, Month,</text>
  <text x="490" y="274" font-size="14" fill="#2B2B3A">Week, Day</text>

  <rect x="478" y="318" width="188" height="132" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <text x="490" y="342" font-size="14" font-weight="700" fill="#2B2B3A">Time calculations</text>
  <text x="490" y="362" font-size="14" fill="#2B2B3A">quick-measure time</text>
  <text x="490" y="382" font-size="14" fill="#2B2B3A">templates (YTD, QTD,</text>
  <text x="490" y="402" font-size="14" fill="#2B2B3A">comparisons) and</text>
  <text x="490" y="422" font-size="14" fill="#2B2B3A">relative dates</text>

  <!-- Arrows are drawn after the boxes -->
  <line x1="230" y1="92" x2="230" y2="123" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="240" y="113" font-size="14" fill="#5B6472">none named</text>
  <line x1="230" y1="204" x2="230" y2="235" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="240" y="225" font-size="14" fill="#5B6472">not set</text>
  <line x1="230" y1="334" x2="230" y2="365" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="240" y="355" font-size="14" fill="#5B6472">not set</text>

  <line x1="572" y1="176" x2="572" y2="207" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="572" y1="284" x2="572" y2="315" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
