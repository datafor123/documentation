<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei','PingFang SC','Noto Sans',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA3B2"/>
    </marker>
  </defs>

  <rect width="1200" height="790" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="470" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#14213D">How the Datafor AI Agent Works (User View)</text>
  <text x="470" y="68" text-anchor="middle" font-size="13" fill="#5B6472">The AI understands and explains; Datafor owns data truth and execution. The Agent never connects to enterprise data directly.</text>

  <!-- 1. Entry points -->
  <rect x="40" y="90" width="860" height="98" rx="12" fill="#F3EFFF" stroke="#C9BBF2" stroke-width="1.5"/>
  <text x="56" y="116" font-size="16" font-weight="700" fill="#5B3FBF">1. Entry points</text>
  <text x="884" y="116" text-anchor="end" font-size="12" fill="#7A6BB0">All four share one analysis logic: the same question gets the same answer everywhere</text>
  <rect x="56" y="128" width="198" height="44" rx="8" fill="#FFFFFF" stroke="#C9BBF2"/>
  <text x="155" y="156" text-anchor="middle" font-size="14" fill="#2B2B3A">Portal AI Assistant</text>
  <rect x="266" y="128" width="198" height="44" rx="8" fill="#FFFFFF" stroke="#C9BBF2"/>
  <text x="365" y="156" text-anchor="middle" font-size="14" fill="#2B2B3A">Dashboard AI Insight</text>
  <rect x="476" y="128" width="198" height="44" rx="8" fill="#FFFFFF" stroke="#C9BBF2"/>
  <text x="575" y="156" text-anchor="middle" font-size="14" fill="#2B2B3A">Embedded in your apps</text>
  <rect x="686" y="128" width="198" height="44" rx="8" fill="#FFFFFF" stroke="#C9BBF2"/>
  <text x="785" y="156" text-anchor="middle" font-size="14" fill="#2B2B3A">AI clients (MCP)</text>

  <!-- Entry points <-> Agent -->
  <line x1="380" y1="190" x2="380" y2="214" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="368" y="206" text-anchor="end" font-size="12" fill="#5B6472">Natural-language question</text>
  <line x1="560" y1="214" x2="560" y2="190" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="572" y="206" font-size="12" fill="#5B6472">Charts · tables · insights · follow-up suggestions</text>

  <!-- 2. AI Agent -->
  <rect x="40" y="216" width="860" height="184" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="56" y="242" font-size="16" font-weight="700" fill="#1F4FD8">2. AI Agent: understand, plan, explain</text>
  <text x="884" y="242" text-anchor="end" font-size="12" fill="#5B6FB0">This is where the LLM works</text>

  <rect x="56" y="254" width="156" height="76" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="134" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2B3A">Understand</text>
  <text x="134" y="297" text-anchor="middle" font-size="12" fill="#5B6472">any language</text>
  <text x="134" y="313" text-anchor="middle" font-size="12" fill="#5B6472">asks when unclear</text>

  <rect x="224" y="254" width="156" height="76" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="302" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2B3A">Match the model</text>
  <text x="302" y="297" text-anchor="middle" font-size="12" fill="#5B6472">metrics · dimensions</text>
  <text x="302" y="313" text-anchor="middle" font-size="12" fill="#5B6472">member values</text>

  <rect x="392" y="254" width="156" height="76" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="470" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2B3A">Plan the analysis</text>
  <text x="470" y="297" text-anchor="middle" font-size="12" fill="#5B6472">one query, or a</text>
  <text x="470" y="313" text-anchor="middle" font-size="12" fill="#5B6472">bounded set of steps</text>

  <rect x="560" y="254" width="156" height="76" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="638" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2B3A">Interpret results</text>
  <text x="638" y="297" text-anchor="middle" font-size="12" fill="#5B6472">insights · evidence</text>
  <text x="638" y="313" text-anchor="middle" font-size="12" fill="#5B6472">stated limits</text>

  <rect x="728" y="254" width="156" height="76" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="806" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#2B2B3A">Keep asking</text>
  <text x="806" y="297" text-anchor="middle" font-size="12" fill="#5B6472">follow-up suggestions</text>
  <text x="806" y="313" text-anchor="middle" font-size="12" fill="#5B6472">session memory</text>

  <rect x="56" y="342" width="828" height="36" rx="8" fill="#DCE7FF"/>
  <text x="470" y="365" text-anchor="middle" font-size="13" fill="#1F3A8A">Session and runtime foundation: live progress · cancel anytime · history · clarify and resume · quotas and usage</text>

  <!-- LLM service (external) -->
  <line x1="900" y1="308" x2="930" y2="308" stroke="#9AA3B2" stroke-width="1.6" stroke-dasharray="6 4" marker-start="url(#arrowGray)" marker-end="url(#arrowGray)"/>
  <rect x="930" y="216" width="230" height="184" rx="12" fill="#FAFAFC" stroke="#9AA3B2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1045" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#14213D">LLM service (external)</text>
  <text x="1045" y="274" text-anchor="middle" font-size="12" fill="#5B6472">Configured by the administrator</text>
  <text x="1045" y="294" text-anchor="middle" font-size="12" fill="#5B6472">and can be swapped</text>
  <text x="1045" y="318" text-anchor="middle" font-size="12" fill="#5B6472">A different model per stage</text>
  <text x="1045" y="342" text-anchor="middle" font-size="12" fill="#5B6472">Receives only the metadata and</text>
  <text x="1045" y="362" text-anchor="middle" font-size="12" fill="#5B6472">aggregated results it needs</text>
  <text x="1045" y="386" text-anchor="middle" font-size="12" fill="#5B6472">Never used for training</text>

  <!-- Agent <-> Datafor (through the governed boundary) -->
  <line x1="380" y1="402" x2="380" y2="498" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="368" y="415" text-anchor="end" font-size="12" fill="#5B6472">Structured query intent (no SQL)</text>
  <line x1="560" y1="498" x2="560" y2="402" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="572" y="496" font-size="12" fill="#5B6472">Query results filtered by your permissions</text>

  <!-- Governed boundary -->
  <rect x="40" y="420" width="860" height="64" rx="10" fill="#FFF4DC" stroke="#F0C36D" stroke-width="1.5"/>
  <text x="56" y="457" font-size="15" font-weight="700" fill="#8A5A00">Governed boundary</text>
  <text x="547" y="439" text-anchor="middle" font-size="12" fill="#6B4A00">The AI proposes structured query intent only; it never writes SQL or MDX</text>
  <text x="547" y="456" text-anchor="middle" font-size="12" fill="#6B4A00">It sees only metadata you may see; Datafor compiles, validates and runs every query</text>
  <text x="547" y="473" text-anchor="middle" font-size="12" fill="#6B4A00">Every number in an answer traces back to an actual query result</text>

  <!-- 3. Datafor BI platform -->
  <rect x="40" y="500" width="860" height="120" rx="12" fill="#E8F7F4" stroke="#A9DED6" stroke-width="1.5"/>
  <text x="56" y="526" font-size="16" font-weight="700" fill="#0B7A6E">3. Datafor BI platform: data truth and execution</text>

  <rect x="56" y="540" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#A9DED6"/>
  <text x="155" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2B3A">Semantic model</text>
  <text x="155" y="585" text-anchor="middle" font-size="12" fill="#5B6472">metrics · dimensions · levels</text>

  <rect x="266" y="540" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#A9DED6"/>
  <text x="365" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2B3A">Permissions</text>
  <text x="365" y="585" text-anchor="middle" font-size="12" fill="#5B6472">model and row-level access</text>

  <rect x="476" y="540" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#A9DED6"/>
  <text x="575" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2B3A">Query engine</text>
  <text x="575" y="585" text-anchor="middle" font-size="12" fill="#5B6472">compiles · validates · executes</text>

  <rect x="686" y="540" width="198" height="60" rx="8" fill="#FFFFFF" stroke="#A9DED6"/>
  <text x="785" y="564" text-anchor="middle" font-size="13" font-weight="700" fill="#2B2B3A">Metrics library · reports</text>
  <text x="785" y="585" text-anchor="middle" font-size="12" fill="#5B6472">certified metrics · add to page</text>

  <!-- Datafor -> data sources -->
  <line x1="470" y1="622" x2="470" y2="646" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="482" y="638" font-size="12" fill="#5B6472">SQL / data access (Datafor only)</text>

  <!-- 4. Enterprise data sources -->
  <rect x="40" y="648" width="860" height="56" rx="12" fill="#F2F4F7" stroke="#CBD2DC" stroke-width="1.5"/>
  <text x="56" y="682" font-size="16" font-weight="700" fill="#3B4252">4. Enterprise data</text>
  <text x="230" y="682" font-size="13" fill="#5B6472">databases · data warehouses · business systems (never accessed directly by the Agent)</text>

  <!-- Legend -->
  <text x="40" y="740" font-size="12" fill="#7A8390">Solid arrows: the round trip of one question.   Dashed line: connection to the external LLM service.</text>
  <text x="40" y="762" font-size="12" fill="#7A8390">Read top to bottom: these are the layers a question passes through. The lower the layer, the more it is a native Datafor capability; the Agent works on top of it.</text>
</svg>
