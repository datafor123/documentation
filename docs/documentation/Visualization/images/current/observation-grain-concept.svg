<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Choose the observation grain</title><desc id="desc">Scatter uses one point per marker member, Box plot compares sample-level measure values, and Histogram bins raw numeric row values.</desc><rect width="1200" height="390" rx="16" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#203047"><text x="36" y="46" font-size="28" fill="#132238" font-weight="700">What does one observation represent?</text><text x="36" y="78" font-size="17" fill="#5b6b80" font-weight="400">Choose the grain before interpreting a distribution</text><rect x="30" y="113" width="350" height="232" rx="3" fill="#fff"/><text x="50" y="152" font-size="25" fill="#132238" font-weight="700">Scatter</text><text x="50" y="194" font-size="18" fill="#2268c4" font-weight="700">Marker = Store</text><text x="50" y="244" font-size="18" fill="#203047" font-weight="400">One point per store</text><text x="50" y="275" font-size="16" fill="#5b6b80" font-weight="400">X and Y are store-level measures</text><rect x="425" y="113" width="350" height="232" rx="3" fill="#fff"/><text x="445" y="152" font-size="25" fill="#132238" font-weight="700">Box plot</text><text x="445" y="194" font-size="18" fill="#2268c4" font-weight="700">Sample = Store</text><text x="445" y="244" font-size="18" fill="#203047" font-weight="400">One observation per store</text><text x="445" y="275" font-size="16" fill="#5b6b80" font-weight="400">Compare store values within a group</text><rect x="820" y="113" width="350" height="232" rx="3" fill="#fff"/><text x="840" y="152" font-size="25" fill="#132238" font-weight="700">Histogram</text><text x="840" y="194" font-size="18" fill="#2268c4" font-weight="700">Value = Transaction amount</text><text x="840" y="244" font-size="18" fill="#203047" font-weight="400">One numeric detail-row value</text><text x="840" y="275" font-size="16" fill="#5b6b80" font-weight="400">Count observations in each interval</text></g></svg>