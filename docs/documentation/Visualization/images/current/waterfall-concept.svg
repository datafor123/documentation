<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">A waterfall accumulates signed changes</title><desc id="desc">Opening 100 plus new sales 40 minus returns 15 equals closing 125. Closing is a total, not another step.</desc><rect width="1200" height="430" rx="16" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#203047"><text x="36" y="46" font-size="28" fill="#132238" font-weight="700">A waterfall adds changes, not ending balances</text><text x="36" y="78" font-size="16" fill="#5b6b80" font-weight="400">Illustrative values — not a product screenshot</text><path d="M70 335 H1120" stroke="#9cacbd" stroke-width="2"/><rect x="150" y="175" width="115" height="160" rx="3" fill="#3478dd"/><text x="178" y="161" font-size="22" fill="#132238" font-weight="700">100</text><text x="148" y="366" font-size="20" fill="#203047" font-weight="400">Opening</text><rect x="410" y="111" width="115" height="64" rx="3" fill="#19826c"/><text x="438" y="97" font-size="22" fill="#132238" font-weight="700">+40</text><text x="408" y="366" font-size="20" fill="#203047" font-weight="400">New sales</text><rect x="670" y="111" width="115" height="24" rx="3" fill="#d85b48"/><text x="698" y="97" font-size="22" fill="#132238" font-weight="700">−15</text><text x="668" y="366" font-size="20" fill="#203047" font-weight="400">Returns</text><rect x="930" y="135" width="115" height="200" rx="3" fill="#3478dd"/><text x="958" y="121" font-size="22" fill="#132238" font-weight="700">125</text><text x="928" y="366" font-size="20" fill="#203047" font-weight="400">Closing</text><path d="M265 175 H410 M525 111 H670 M785 135 H930" fill="none" stroke="#8a9aab" stroke-width="2" stroke-dasharray="5 5"/><text x="36" y="408" font-size="19" fill="#5b6b80" font-weight="400">100 + 40 − 15 = 125. Do not add the closing 125 again as a change.</text></g></svg>