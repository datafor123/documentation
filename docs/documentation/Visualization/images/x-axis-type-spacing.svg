<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Continuous versus categorical X axis for dates</title>
  <desc id="desc">The same four days, 1, 2, 5 and 6 October, on two column charts. With the Continuous type each date sits at its position in time, so the space for 3 and 4 October stays empty and the gap is visible. With the Categorical type each returned date gets one equal slot, so 2 and 5 October sit side by side. The Type setting appears only for date and time fields, and Continuous is the default.</desc>
  <rect width="700" height="470" fill="#FFFFFF"/>
  <rect x="10" y="10" width="680" height="190" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="30" y="42" font-size="18" font-weight="700" fill="#1F4FD8">Continuous (default)</text>
  <text x="30" y="64" font-size="14" fill="#5B6FB0">Each date at its position in time: the space for 3 and 4 Oct stays empty</text>
  <line x1="60" y1="162" x2="660" y2="162" stroke="#3B4252" stroke-width="1.2"/>
  <line x1="110" y1="162" x2="110" y2="167" stroke="#3B4252" stroke-width="1"/>
  <rect x="88.0" y="102.0" width="44" height="60.0" fill="#1F4FD8" opacity="0.85"/>
  <text x="110.0" y="96.0" font-size="14" text-anchor="middle" fill="#2B2B3A">120</text>
  <text x="110.0" y="184" font-size="14" text-anchor="middle" fill="#2B2B3A">1 Oct</text>
  <line x1="210" y1="162" x2="210" y2="167" stroke="#3B4252" stroke-width="1"/>
  <rect x="188.0" y="117.0" width="44" height="45.0" fill="#1F4FD8" opacity="0.85"/>
  <text x="210.0" y="111.0" font-size="14" text-anchor="middle" fill="#2B2B3A">90</text>
  <text x="210.0" y="184" font-size="14" text-anchor="middle" fill="#2B2B3A">2 Oct</text>
  <line x1="310" y1="162" x2="310" y2="167" stroke="#3B4252" stroke-width="1"/>
  <text x="310.0" y="150" font-size="14" text-anchor="middle" fill="#A0A7B2">no data</text>
  <text x="310.0" y="184" font-size="14" text-anchor="middle" fill="#A0A7B2">3 Oct</text>
  <line x1="410" y1="162" x2="410" y2="167" stroke="#3B4252" stroke-width="1"/>
  <text x="410.0" y="150" font-size="14" text-anchor="middle" fill="#A0A7B2">no data</text>
  <text x="410.0" y="184" font-size="14" text-anchor="middle" fill="#A0A7B2">4 Oct</text>
  <line x1="510" y1="162" x2="510" y2="167" stroke="#3B4252" stroke-width="1"/>
  <rect x="488.0" y="92.0" width="44" height="70.0" fill="#1F4FD8" opacity="0.85"/>
  <text x="510.0" y="86.0" font-size="14" text-anchor="middle" fill="#2B2B3A">140</text>
  <text x="510.0" y="184" font-size="14" text-anchor="middle" fill="#2B2B3A">5 Oct</text>
  <line x1="610" y1="162" x2="610" y2="167" stroke="#3B4252" stroke-width="1"/>
  <rect x="588.0" y="107.0" width="44" height="55.0" fill="#1F4FD8" opacity="0.85"/>
  <text x="610.0" y="101.0" font-size="14" text-anchor="middle" fill="#2B2B3A">110</text>
  <text x="610.0" y="184" font-size="14" text-anchor="middle" fill="#2B2B3A">6 Oct</text>
  <rect x="10" y="220" width="680" height="190" rx="12" fill="#F3EFFF" stroke="#C9BBF2" stroke-width="1.5"/>
  <text x="30" y="252" font-size="18" font-weight="700" fill="#5B3FBF">Categorical</text>
  <text x="30" y="274" font-size="14" fill="#7A6BB0">One equal slot per returned date: 2 Oct and 5 Oct sit side by side</text>
  <line x1="60" y1="372" x2="660" y2="372" stroke="#3B4252" stroke-width="1.2"/>
  <line x1="135" y1="372" x2="135" y2="377" stroke="#3B4252" stroke-width="1"/>
  <rect x="113.0" y="312.0" width="44" height="60.0" fill="#5B3FBF" opacity="0.85"/>
  <text x="135.0" y="306.0" font-size="14" text-anchor="middle" fill="#2B2B3A">120</text>
  <text x="135.0" y="394" font-size="14" text-anchor="middle" fill="#2B2B3A">1 Oct</text>
  <line x1="285" y1="372" x2="285" y2="377" stroke="#3B4252" stroke-width="1"/>
  <rect x="263.0" y="327.0" width="44" height="45.0" fill="#5B3FBF" opacity="0.85"/>
  <text x="285.0" y="321.0" font-size="14" text-anchor="middle" fill="#2B2B3A">90</text>
  <text x="285.0" y="394" font-size="14" text-anchor="middle" fill="#2B2B3A">2 Oct</text>
  <line x1="435" y1="372" x2="435" y2="377" stroke="#3B4252" stroke-width="1"/>
  <rect x="413.0" y="302.0" width="44" height="70.0" fill="#5B3FBF" opacity="0.85"/>
  <text x="435.0" y="296.0" font-size="14" text-anchor="middle" fill="#2B2B3A">140</text>
  <text x="435.0" y="394" font-size="14" text-anchor="middle" fill="#2B2B3A">5 Oct</text>
  <line x1="585" y1="372" x2="585" y2="377" stroke="#3B4252" stroke-width="1"/>
  <rect x="563.0" y="317.0" width="44" height="55.0" fill="#5B3FBF" opacity="0.85"/>
  <text x="585.0" y="311.0" font-size="14" text-anchor="middle" fill="#2B2B3A">110</text>
  <text x="585.0" y="394" font-size="14" text-anchor="middle" fill="#2B2B3A">6 Oct</text>
  <text x="10" y="436" font-size="14" fill="#5B6472">Style → X axis → Type appears only when the X-axis field is a date or time level.</text>
  <text x="10" y="458" font-size="14" fill="#5B6472">Text and numeric fields always use categorical spacing.</text>
</svg>
