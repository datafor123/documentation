<svg xmlns="http://www.w3.org/2000/svg" width="700" height="710" viewBox="0 0 700 710" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Image map coordinates: origin bottom-left, Y upward, optional own units</title>
  <desc id="desc">An image editor counts pixels from the top-left corner with y growing downward. The Image map puts (0, 0) at the bottom-left corner with Y growing upward; by default the X-axis maximum and Y-axis maximum are the image width and height, here 1008 and 816. The same spot at pixel (252, 204) is therefore (252, 612) in the Image map. Setting the minimums and maximums to 0–40 and 0–32 turns the coordinates into metres of a floor plan, and the spot becomes (10, 24).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
  </defs>

  <rect width="700" height="710" fill="#FFFFFF"/>

  <!-- Lane: image editor -->
  <rect x="10" y="10" width="335" height="335" rx="12" fill="#F5F6F8" stroke="#D5D9E0" stroke-width="1.5"/>
  <text x="30" y="42" font-size="18" font-weight="700" fill="#3B4252">Image file (pixels)</text>
  <text x="30" y="64" font-size="14" fill="#5B6472">(0, 0) top-left, y grows downward</text>
  <rect x="60" y="100" width="250" height="202" fill="#FFFFFF" stroke="#3B4252" stroke-width="1.5"/>
  <circle cx="60" cy="100" r="4" fill="#3B4252"/>
  <text x="54" y="96" font-size="14" text-anchor="end" fill="#2B2B3A">(0, 0)</text>
  <text x="310" y="324" font-size="14" text-anchor="end" fill="#2B2B3A">(1008, 816)</text>
  <text x="66" y="324" font-size="14" fill="#5B6472">1008 × 816 px</text>
  <circle cx="122.5" cy="150.5" r="6" fill="#D64545"/>
  <text x="134" y="155" font-size="14" fill="#2B2B3A">pixel (252, 204)</text>
  <text x="152" y="88" font-size="14" fill="#3B4252">x</text>
  <text x="40" y="216" font-size="14" text-anchor="middle" fill="#3B4252">y</text>

  <!-- Lane: Image map defaults -->
  <rect x="355" y="10" width="335" height="335" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="375" y="42" font-size="18" font-weight="700" fill="#1F4FD8">Image map, default range</text>
  <text x="375" y="64" font-size="14" fill="#5B6FB0">(0, 0) bottom-left, Y grows upward</text>
  <rect x="415" y="100" width="250" height="202" fill="#FFFFFF" stroke="#1F4FD8" stroke-width="1.5"/>
  <circle cx="415" cy="302" r="4" fill="#1F4FD8"/>
  <text x="409" y="300" font-size="14" text-anchor="end" fill="#2B2B3A">(0, 0)</text>
  <text x="665" y="92" font-size="14" text-anchor="end" fill="#2B2B3A">(1008, 816)</text>
  <circle cx="477.5" cy="150.5" r="6" fill="#D64545"/>
  <text x="489" y="155" font-size="14" fill="#2B2B3A">(252, 612)</text>
  <text x="489" y="175" font-size="14" fill="#5B6FB0">Y = 816 − 204</text>
  <text x="507" y="334" font-size="14" fill="#3B4252">X</text>
  <text x="403" y="200" font-size="14" text-anchor="middle" fill="#3B4252">Y</text>

  <!-- Lane: own units -->
  <rect x="10" y="365" width="680" height="335" rx="12" fill="#EAF6EC" stroke="#9CCFA4" stroke-width="1.5"/>
  <text x="30" y="397" font-size="18" font-weight="700" fill="#2E7D32">Own units: Style → Map settings</text>
  <text x="30" y="419" font-size="14" fill="#4F8F55">X-axis 0–40 and Y-axis 0–32 for a 40 × 32 m floor plan</text>
  <rect x="170" y="445" width="250" height="202" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
  <circle cx="232.5" cy="495.5" r="6" fill="#D64545"/>
  <text x="244" y="500" font-size="14" fill="#2B2B3A">(10, 24)</text>
  <text x="162" y="455" font-size="14" font-weight="700" text-anchor="end" fill="#2B2B3A">Y-axis maximum</text>
  <text x="162" y="474" font-size="14" text-anchor="end" fill="#2B2B3A">32</text>
  <text x="162" y="628" font-size="14" font-weight="700" text-anchor="end" fill="#2B2B3A">Y-axis minimum</text>
  <text x="162" y="647" font-size="14" text-anchor="end" fill="#2B2B3A">0</text>
  <text x="170" y="668" font-size="14" font-weight="700" fill="#2B2B3A">X-axis minimum</text><text x="170" y="687" font-size="14" fill="#2B2B3A">0</text>
  <text x="420" y="668" font-size="14" font-weight="700" text-anchor="end" fill="#2B2B3A">X-axis maximum</text><text x="420" y="687" font-size="14" text-anchor="end" fill="#2B2B3A">40</text>

  <text x="445" y="470" font-size="14" fill="#2B2B3A">The same spot:</text>
  <text x="445" y="492" font-size="14" fill="#2B2B3A">pixel (252, 204)</text>
  <text x="445" y="514" font-size="14" fill="#2B2B3A">→ (252, 612) by default</text>
  <text x="445" y="536" font-size="14" fill="#2B2B3A">→ (10, 24) in metres</text>
  <text x="445" y="574" font-size="14" fill="#4F8F55">Empty maximums are filled</text>
  <text x="445" y="594" font-size="14" fill="#4F8F55">with the image's width and</text>
  <text x="445" y="614" font-size="14" fill="#4F8F55">height when you select it.</text>

  <!-- Axis direction arrows (drawn after the lanes) -->
  <line x1="66" y1="84" x2="144" y2="84" stroke="#3B4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="40" y1="110" x2="40" y2="198" stroke="#3B4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="421" y1="318" x2="499" y2="318" stroke="#3B4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="403" y1="284" x2="403" y2="208" stroke="#3B4252" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
