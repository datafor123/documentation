<svg xmlns="http://www.w3.org/2000/svg" width="700" height="604" viewBox="0 0 700 604" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where a report parameter gets its value and where the value is read</title>
  <desc id="desc">The current value of a report parameter comes from the first source that has a value: a filter bound to the parameter, then the parameter in the report URL, then the parameter's default value. Calculated measures, component titles, text components, model SQL, default tab rules and visibility rules read the value, and other filters bound to the same parameter switch to it. When the value changes, only components that use the parameter re-query.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
  </defs>

  <rect width="700" height="604" fill="#FFFFFF"/>

  <!-- Lane 1: value sources in priority order -->
  <rect x="10" y="10" width="680" height="190" rx="12" fill="#FFF6E5" stroke="#F2C98A" stroke-width="1.5"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#9A5B00">Where the value comes from</text>

  <rect x="26" y="56" width="196" height="104" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <circle cx="48" cy="79" r="12" fill="#9A5B00"/>
  <text x="48" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="68" y="84" font-size="16" font-weight="700" fill="#2B2B3A">Bound filter</text>
  <text x="40" y="112" font-size="14" fill="#5B6472">The selection of a filter</text>
  <text x="40" y="132" font-size="14" fill="#5B6472">with Data source →</text>
  <text x="40" y="152" font-size="14" fill="#5B6472">Parameter</text>

  <rect x="252" y="56" width="196" height="104" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <circle cx="274" cy="79" r="12" fill="#9A5B00"/>
  <text x="274" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="294" y="84" font-size="16" font-weight="700" fill="#2B2B3A">Report URL</text>
  <text x="266" y="112" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">?GrowthRate=0.15</text>
  <text x="266" y="132" font-size="14" fill="#5B6472">or <tspan font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">?param_GrowthRate=…</tspan></text>
  <text x="266" y="152" font-size="14" fill="#5B6472">Several values: <tspan font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">a,b</tspan></text>

  <rect x="478" y="56" width="196" height="104" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <circle cx="500" cy="79" r="12" fill="#9A5B00"/>
  <text x="500" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="520" y="84" font-size="16" font-weight="700" fill="#2B2B3A">Default value</text>
  <text x="492" y="112" font-size="14" fill="#5B6472">Set in the Parameters</text>
  <text x="492" y="132" font-size="14" fill="#5B6472">dialog</text>

  <text x="30" y="186" font-size="14" fill="#5B6472">A source is used only when the ones before it have no value.</text>

  <!-- Current value -->
  <rect x="190" y="230" width="320" height="46" rx="23" fill="#F3EFFF" stroke="#5B3FBF" stroke-width="1.5"/>
  <text x="350" y="259" text-anchor="middle" font-size="16" font-weight="700" fill="#5B3FBF">Current value: GrowthRate = 0.15</text>

  <!-- Lane 2: consumers -->
  <rect x="10" y="306" width="680" height="288" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="30" y="336" font-size="18" font-weight="700" fill="#1F4FD8">Where it is read</text>
  <text x="30" y="358" font-size="14" fill="#2B2B3A">When the value changes, only the components that use it re-query.</text>

  <rect x="26" y="372" width="318" height="62" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="40" y="396" font-size="15" font-weight="700" fill="#2B2B3A">Calculated measure</text>
  <text x="40" y="420" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">ParamRef("GrowthRate")<tspan font-family="'Segoe UI',Arial,sans-serif" fill="#5B6472"> or </tspan>${GrowthRate}</text>

  <rect x="356" y="372" width="318" height="62" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="370" y="396" font-size="15" font-weight="700" fill="#2B2B3A">Component title</text>
  <text x="370" y="420" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">Sales (rate: ${GrowthRate})</text>

  <rect x="26" y="444" width="318" height="62" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="40" y="468" font-size="15" font-weight="700" fill="#2B2B3A">Text, Shape, Rich text, Web page</text>
  <text x="40" y="492" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">{{param.GrowthRate}}</text>

  <rect x="356" y="444" width="318" height="62" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="370" y="468" font-size="15" font-weight="700" fill="#2B2B3A">Model SQL <tspan font-size="14" font-weight="400" fill="#5B6472">(# for system variables)</tspan></text>
  <text x="370" y="492" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">${ReportYear}</text>
  <text x="500" y="492" font-size="14" font-family="Consolas,'Courier New',monospace" fill="#2B2B3A">#{system.username}</text>

  <rect x="26" y="516" width="318" height="62" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="40" y="540" font-size="15" font-weight="700" fill="#2B2B3A">Default tab and visibility rules</text>
  <text x="40" y="564" font-size="14" fill="#5B6472">Pick the parameter in the rule</text>

  <rect x="356" y="516" width="318" height="62" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="370" y="540" font-size="15" font-weight="700" fill="#2B2B3A">Other filters bound to it</text>
  <text x="370" y="564" font-size="14" fill="#5B6472">Switch to the same value</text>

  <!-- Arrows are drawn after the lanes so the lane backgrounds do not cover them -->
  <line x1="222" y1="108" x2="249" y2="108" stroke="#9A5B00" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="448" y1="108" x2="475" y2="108" stroke="#9A5B00" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="350" y1="200" x2="350" y2="227" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="276" x2="350" y2="303" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
