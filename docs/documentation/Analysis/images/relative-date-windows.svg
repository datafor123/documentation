  <line x1="578.7" y1="86" x2="578.7" y2="514" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="578.7" y="532" text-anchor="end" font-size="14" font-weight="700" fill="#C0392B">Today, 9 Oct 2026</text>
