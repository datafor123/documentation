<svg xmlns="http://www.w3.org/2000/svg" width="700" height="594" viewBox="0 0 700 594" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Relative date periods when today is 9 October 2026</title>
  <desc id="desc">With today on 9 October 2026: Last 7 Days is 3 to 9 October 2026 and includes today; a custom Last 7 days rule with Exclude today is 2 to 8 October; Month to Date is 1 to 9 October; Last Month is 1 to 30 September; Last 3 Calendar Months is 1 July to 30 September and leaves out the current month; Last 365 Days is the rolling window 10 October 2025 to 9 October 2026; a custom Last 7 days rule shifted back 1 year is 3 to 9 October 2025. The axis skips 15 October 2025 to 30 June 2026.</desc>
  <rect width="700" height="594" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="18" font-weight="700" fill="#3B4252">Relative periods when today is 9 October 2026</text>
  <rect x="10" y="50" width="680" height="36" rx="8" fill="#F5F6F8" stroke="#D5D9E0"/>
  <text x="74" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#3B4252">Oct 2025</text>
  <text x="211" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#3B4252">Jul</text>
  <text x="345.1" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#3B4252">Aug</text>
  <text x="477" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#3B4252">Sep</text>
  <text x="609" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#3B4252">Oct 2026</text>
  <rect x="10" y="96" width="680" height="58" fill="#F7F8FA"/>
  <rect x="10" y="212" width="680" height="58" fill="#F7F8FA"/>
  <rect x="10" y="328" width="680" height="58" fill="#F7F8FA"/>
  <rect x="10" y="444" width="680" height="58" fill="#F7F8FA"/>
  <line x1="24" y1="86" x2="24" y2="502" stroke="#E2E5EA"/>
  <line x1="124" y1="86" x2="124" y2="502" stroke="#E2E5EA"/>
  <line x1="144" y1="86" x2="144" y2="502" stroke="#E2E5EA"/>
  <line x1="278.1" y1="86" x2="278.1" y2="502" stroke="#E2E5EA"/>
  <line x1="412.2" y1="86" x2="412.2" y2="502" stroke="#E2E5EA"/>
  <line x1="541.9" y1="86" x2="541.9" y2="502" stroke="#E2E5EA"/>
  <line x1="676" y1="86" x2="676" y2="502" stroke="#E2E5EA"/>
  <path d="M128,508 l6,-14 M136,508 l6,-14" stroke="#7A8390" stroke-width="1.6"/>
  <path d="M128,80 l6,-14 M136,80 l6,-14" stroke="#7A8390" stroke-width="1.6"/>
  <text x="24" y="116" font-size="15" font-weight="700" fill="#2B2B3A">Last 7 Days<tspan dx="12" font-size="14" font-weight="400" fill="#5B6472">3 – 9 Oct 2026, includes today</tspan></text>
  <rect x="550.6" y="125" width="30.3" height="20" rx="4" fill="#4C74E0"/>
  <text x="24" y="174" font-size="15" font-weight="700" fill="#2B2B3A">Custom: Last 7 days<tspan dx="12" font-size="14" font-weight="400" fill="#5B6472">Exclude today: 2 – 8 Oct 2026</tspan></text>
  <rect x="546.2" y="183" width="30.3" height="20" rx="4" fill="#7A5FD0"/>
  <text x="24" y="232" font-size="15" font-weight="700" fill="#2B2B3A">Month to Date<tspan dx="12" font-size="14" font-weight="400" fill="#5B6472">1 – 9 Oct 2026</tspan></text>
