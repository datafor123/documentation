<svg xmlns="http://www.w3.org/2000/svg" width="700" height="716" viewBox="0 0 700 716" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">XDM handshake between the host page and an embedded report</title>
  <desc id="desc">1. The host page loads the report URL with __xdmTimeout in the iframe. 2. When the report has loaded, it posts visualizerReportFileLoaded with its id and waits up to __xdmTimeout milliseconds, 50 by default. 3. The host replies in time with trustMark set to that id, event query, init true and the filters, so the report's first queries already use the filters. If no init message arrives in time, the report loads unfiltered and a late init message no longer re-queries the charts. 4. Later messages with the same trustMark and event query but without init make the charts re-query with the new filters. Messages with another or no trustMark are ignored. In edit mode the report does not post or listen.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4FD8"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A929E"/>
    </marker>
    <style>
      .h { paint-order: stroke; stroke: #FFFFFF; stroke-width: 6px; stroke-linejoin: round; }
      .m { font-family: Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="700" height="716" fill="#FFFFFF"/>

  <!-- Participants -->
  <rect x="15" y="14" width="190" height="60" rx="12" fill="#F5F6F8" stroke="#D5D9E0" stroke-width="1.5"/>
  <text x="110" y="40" font-size="16" font-weight="700" fill="#3B4252" text-anchor="middle">Host page</text>
  <text x="110" y="62" font-size="14" fill="#5B6472" text-anchor="middle">your application</text>

  <rect x="425" y="14" width="210" height="60" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="530" y="40" font-size="16" font-weight="700" fill="#1F4FD8" text-anchor="middle">Report in the iframe</text>
  <text x="530" y="62" font-size="14" fill="#5B6FB0" text-anchor="middle">read-only view</text>

  <!-- Lifelines -->
  <line x1="110" y1="74" x2="110" y2="660" stroke="#B4BAC4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="530" y1="74" x2="530" y2="660" stroke="#B4BAC4" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Waiting period on the report lifeline -->
  <rect x="524" y="204" width="12" height="108" rx="3" fill="#FFF6E5" stroke="#F2C98A" stroke-width="1.5"/>
  <text x="546" y="236" font-size="14" fill="#9A5B00">waits up to</text>
  <text x="546" y="255" font-size="14" fill="#9A5B00" class="m">__xdmTimeout</text>
  <text x="546" y="274" font-size="14" fill="#9A5B00">ms (default 50)</text>

  <!-- Report-side results -->
  <rect x="330" y="330" width="360" height="40" rx="10" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="346" y="356" font-size="14" fill="#2B2B3A">First queries already use the filters</text>

  <rect x="330" y="382" width="360" height="62" rx="10" fill="#FFF6E5" stroke="#F2C98A" stroke-width="1.5"/>
  <text x="346" y="406" font-size="14" fill="#2B2B3A">No reply in time: loads unfiltered. A late</text>
  <text x="346" y="426" font-size="14" fill="#2B2B3A">init message does not re-query the charts.</text>

  <rect x="330" y="540" width="360" height="40" rx="10" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="346" y="566" font-size="14" fill="#2B2B3A">Charts re-query with the new filters</text>

  <!-- Messages -->
  <!-- 1 -->
  <text x="124" y="106" font-size="14" fill="#2B2B3A" class="h"><tspan font-weight="700">1</tspan>  Load the report URL with</text>
  <text x="124" y="125" font-size="14" fill="#2B2B3A" class="h m">?__xdmTimeout=150</text>
  <line x1="110" y1="138" x2="528" y2="138" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <text x="124" y="166" font-size="14" fill="#2B2B3A" class="h"><tspan font-weight="700">2</tspan>  Loaded: postMessage to the parent</text>
  <text x="124" y="185" font-size="14" fill="#5B6472" class="h m">{"event":"visualizerReportFileLoaded","id":"&lt;id&gt;"}</text>
  <line x1="524" y1="200" x2="112" y2="200" stroke="#1F4FD8" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- 3 -->
  <text x="124" y="244" font-size="14" fill="#2B2B3A" class="h"><tspan font-weight="700">3</tspan>  Reply in time</text>
  <text x="124" y="263" font-size="14" fill="#5B6472" class="h m">{"trustMark":"&lt;id&gt;","event":"query",</text>
  <text x="124" y="282" font-size="14" fill="#5B6472" class="h m"> "init":true,"filters":[…]}</text>
  <line x1="110" y1="296" x2="522" y2="296" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 4 -->
  <text x="124" y="482" font-size="14" fill="#2B2B3A" class="h"><tspan font-weight="700">4</tspan>  Later, when the host's filters change</text>
  <text x="124" y="501" font-size="14" fill="#5B6472" class="h m">{"trustMark":"&lt;id&gt;","event":"query",</text>
  <text x="124" y="520" font-size="14" fill="#5B6472" class="h m"> "filters":[…]}</text>
  <line x1="110" y1="530" x2="528" y2="530" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <text x="124" y="616" font-size="14" fill="#2B2B3A" class="h">Another or no <tspan class="m">trustMark</tspan></text>
  <line x1="110" y1="630" x2="528" y2="630" stroke="#8A929E" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowGrey)"/>
  <text x="546" y="635" font-size="14" font-weight="700" fill="#5B6472">ignored</text>

  <!-- Footer -->
  <text x="15" y="696" font-size="14" fill="#5B6472">Edit mode: the report neither posts the loaded message nor listens, so XDM has no effect.</text>
</svg>
