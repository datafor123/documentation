<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei','PingFang SC','Noto Sans',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How a paginated report is put together</title>
  <desc id="desc">On the left, data: a model dataset built from an analysis model or an SQL dataset on a database connection, both filtered by report parameters that readers set in the viewer. In the middle, the page: a header band repeated on every page, a body with text blocks and one table or crosstab that flows across pages, and a footer band. On the right, outputs: the viewer pages, formatted exports PDF, Excel and Word, data exports flat Excel and CSV, scheduled distribution by email or to a repository folder, and drill-through from dashboards.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#FFFFFF"/>

  <!-- Data lane -->
  <rect x="10" y="10" width="250" height="500" rx="12" fill="#EEF4FF" stroke="#C7D6F2" stroke-width="1.5"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#2B2B3A">1. Data</text>
  <text x="30" y="62" font-size="13" fill="#5B6472">Datasets return rows.</text>

  <rect x="30" y="84" width="210" height="88" rx="8" fill="#FFFFFF" stroke="#4C7BD9" stroke-width="1.5"/>
  <text x="46" y="108" font-size="14" font-weight="700" fill="#2B2B3A">Model dataset</text>
  <text x="46" y="128" font-size="12" fill="#5B6472">Fields of an analysis model;</text>
  <text x="46" y="145" font-size="12" fill="#5B6472">the query is generated for you.</text>
  <text x="46" y="162" font-size="12" fill="#7A8390">Row-level security applies.</text>

  <rect x="30" y="188" width="210" height="88" rx="8" fill="#FFFFFF" stroke="#3F8F6B" stroke-width="1.5"/>
  <text x="46" y="212" font-size="14" font-weight="700" fill="#2B2B3A">SQL dataset</text>
  <text x="46" y="232" font-size="12" fill="#5B6472">Your own SQL on a connection,</text>
  <text x="46" y="249" font-size="12" fill="#5B6472">with ${param} placeholders.</text>
  <text x="46" y="266" font-size="12" fill="#7A8390">Best for long detail lists.</text>

  <rect x="30" y="300" width="210" height="96" rx="8" fill="#FFFFFF" stroke="#C9A96E" stroke-width="1.5"/>
  <text x="46" y="324" font-size="14" font-weight="700" fill="#2B2B3A">Parameters</text>
  <text x="46" y="344" font-size="12" fill="#5B6472">Date, list, text, number, yes/no.</text>
  <text x="46" y="361" font-size="12" fill="#5B6472">Filter model datasets by level,</text>
  <text x="46" y="378" font-size="12" fill="#5B6472">bind ${param} in SQL.</text>
  <line x1="135" y1="300" x2="135" y2="278" stroke="#3B4252" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="135" y1="300" x2="135" y2="278" stroke="none"/>
  <text x="30" y="428" font-size="12" fill="#7A8390">Set by the reader in the viewer,</text>
  <text x="30" y="445" font-size="12" fill="#7A8390">by a URL (p_name=value), by a</text>
  <text x="30" y="462" font-size="12" fill="#7A8390">drill-through, or by a distribution.</text>

  <!-- Page lane -->
  <rect x="280" y="10" width="300" height="500" rx="12" fill="#F4F7FB" stroke="#D5DEEA" stroke-width="1.5"/>
  <text x="300" y="40" font-size="18" font-weight="700" fill="#2B2B3A">2. Page</text>
  <text x="300" y="62" font-size="13" fill="#5B6472">Fixed paper size, flows across pages.</text>

  <!-- paper -->
  <rect x="320" y="84" width="220" height="400" fill="#FFFFFF" stroke="#8A93A3" stroke-width="1.2"/>
  <rect x="320" y="84" width="220" height="48" fill="#FBEFEA" stroke="#D96C4C" stroke-width="1"/>
  <text x="330" y="104" font-size="12" font-weight="700" fill="#2B2B3A">Header</text>
  <text x="330" y="121" font-size="11" fill="#5B6472">title, logo, page X of Y, {param}</text>

  <rect x="320" y="132" width="220" height="304" fill="#FFFFFF"/>
  <text x="330" y="152" font-size="12" font-weight="700" fill="#2B2B3A">Body</text>
  <rect x="330" y="162" width="200" height="22" fill="#F4F7FB" stroke="#D5DEEA"/>
  <text x="336" y="177" font-size="11" fill="#5B6472">Text block, e.g. {_filters}</text>
  <!-- table -->
  <rect x="330" y="192" width="200" height="22" fill="#DDE6F2" stroke="#C7D6F2"/>
  <text x="336" y="207" font-size="11" font-weight="700" fill="#2B2B3A">Table or crosstab</text>
  <rect x="330" y="214" width="200" height="18" fill="#EEF2F7" stroke="#D5DEEA"/>
  <text x="336" y="227" font-size="11" fill="#5B6472">Group: Region</text>
  <rect x="330" y="232" width="200" height="18" fill="#FFFFFF" stroke="#D5DEEA"/>
  <rect x="330" y="250" width="200" height="18" fill="#F7F9FC" stroke="#D5DEEA"/>
  <rect x="330" y="268" width="200" height="18" fill="#FFFFFF" stroke="#D5DEEA"/>
  <rect x="330" y="286" width="200" height="18" fill="#EEF2F7" stroke="#D5DEEA"/>
  <text x="336" y="299" font-size="11" fill="#5B6472">Subtotal</text>
  <rect x="330" y="304" width="200" height="18" fill="#EEF2F7" stroke="#D5DEEA"/>
  <text x="336" y="317" font-size="11" fill="#5B6472">Group: next region …</text>
  <rect x="330" y="322" width="200" height="18" fill="#FFFFFF" stroke="#D5DEEA"/>
  <rect x="330" y="340" width="200" height="18" fill="#F7F9FC" stroke="#D5DEEA"/>
  <rect x="330" y="358" width="200" height="18" fill="#DDE6F2" stroke="#C7D6F2"/>
  <text x="336" y="371" font-size="11" font-weight="700" fill="#2B2B3A">Grand total</text>
  <text x="330" y="400" font-size="11" fill="#7A8390">Rows continue on the next page;</text>
  <text x="330" y="416" font-size="11" fill="#7A8390">column headers repeat.</text>

  <rect x="320" y="436" width="220" height="48" fill="#FBEFEA" stroke="#D96C4C" stroke-width="1"/>
  <text x="330" y="456" font-size="12" font-weight="700" fill="#2B2B3A">Footer</text>
  <text x="330" y="473" font-size="11" fill="#5B6472">printed date, user, page number</text>

  <!-- arrow data -> page -->
  <line x1="240" y1="240" x2="318" y2="240" stroke="#3B4252" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outputs lane -->
  <rect x="600" y="10" width="250" height="500" rx="12" fill="#EAF6EC" stroke="#BFE0C6" stroke-width="1.5"/>
  <text x="620" y="40" font-size="18" font-weight="700" fill="#2B2B3A">3. Outputs</text>
  <text x="620" y="62" font-size="13" fill="#5B6472">Same definition, several forms.</text>

  <rect x="620" y="84" width="210" height="66" rx="8" fill="#FFFFFF" stroke="#BFE0C6"/>
  <text x="636" y="106" font-size="13" font-weight="700" fill="#2B2B3A">Viewer</text>
  <text x="636" y="124" font-size="12" fill="#5B6472">Parameter panel, page by page,</text>
  <text x="636" y="140" font-size="12" fill="#5B6472">zoom, full screen, copy link.</text>

  <rect x="620" y="162" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#BFE0C6"/>
  <text x="636" y="184" font-size="13" font-weight="700" fill="#2B2B3A">Formatted export</text>
  <text x="636" y="202" font-size="12" fill="#5B6472">PDF and print, Excel, Word (RTF).</text>
  <text x="636" y="218" font-size="12" fill="#5B6472">Same layout as the pages;</text>
  <text x="636" y="234" font-size="12" fill="#5B6472">one sheet per group on page breaks.</text>

  <rect x="620" y="254" width="210" height="66" rx="8" fill="#FFFFFF" stroke="#BFE0C6"/>
  <text x="636" y="276" font-size="13" font-weight="700" fill="#2B2B3A">Data export</text>
  <text x="636" y="294" font-size="12" fill="#5B6472">Excel (flat) and CSV: one row</text>
  <text x="636" y="310" font-size="12" fill="#5B6472">per record, no totals or merges.</text>

  <rect x="620" y="332" width="210" height="80" rx="8" fill="#FFFFFF" stroke="#BFE0C6"/>
  <text x="636" y="354" font-size="13" font-weight="700" fill="#2B2B3A">Distribution</text>
  <text x="636" y="372" font-size="12" fill="#5B6472">Daily, weekly or monthly: email</text>
  <text x="636" y="388" font-size="12" fill="#5B6472">attachments or a repository folder,</text>
  <text x="636" y="404" font-size="12" fill="#5B6472">one copy per parameter value or row.</text>

  <rect x="620" y="424" width="210" height="66" rx="8" fill="#FFFFFF" stroke="#BFE0C6"/>
  <text x="636" y="446" font-size="13" font-weight="700" fill="#2B2B3A">From a dashboard</text>
  <text x="636" y="464" font-size="12" fill="#5B6472">Drill-through opens the report with</text>
  <text x="636" y="480" font-size="12" fill="#5B6472">the clicked members as parameters.</text>

  <!-- arrow page -> outputs -->
  <line x1="540" y1="240" x2="618" y2="240" stroke="#3B4252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="579" y="228" font-size="11" fill="#7A8390" text-anchor="middle">render</text>
  <text x="279" y="228" font-size="11" fill="#7A8390" text-anchor="middle">rows</text>
</svg>
