<svg xmlns="http://www.w3.org/2000/svg" width="700" height="910" viewBox="0 0 700 910" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How conditions reach a component and where the Conditions list shows them</title>
  <desc id="desc">Six sources can affect a component: its own component filter, filter components, clicks on other charts, drilling, values passed in by a drill-through or the URL, and parameters. Every condition is applied together with AND, and conditions on the same field narrow each other: Region is East China or South China combined with Region is East China or North China leaves East China. The Conditions button lists the conditions grouped as Link, Filter, Passed in and Own. Parameters add no condition and are not listed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
  </defs>

  <rect width="700" height="910" fill="#FFFFFF"/>

  <!-- Lane 1: sources -->
  <rect x="10" y="10" width="680" height="296" rx="12" fill="#F5F6F8" stroke="#D5D9E0" stroke-width="1.5"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#3B4252">Where conditions come from</text>

  <!-- Row 1 -->
  <rect x="26" y="56" width="204" height="112" rx="8" fill="#FFFFFF" stroke="#B4BAC4"/>
  <text x="40" y="84" font-size="16" font-weight="700" fill="#2B2B3A">Component filter</text>
  <text x="40" y="108" font-size="14" fill="#5B6472">Data → Filters of the</text>
  <text x="40" y="128" font-size="14" fill="#5B6472">component; always on</text>
  <rect x="40" y="138" width="50" height="22" rx="11" fill="#F5F6F8" stroke="#B4BAC4"/>
  <text x="65" y="154" text-anchor="middle" font-size="14" fill="#3B4252">Own</text>

  <rect x="248" y="56" width="204" height="112" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="262" y="84" font-size="16" font-weight="700" fill="#2B2B3A">Filter component</text>
  <text x="262" y="108" font-size="14" fill="#5B6472">Filters the components in</text>
  <text x="262" y="128" font-size="14" fill="#5B6472">its Linked components</text>
  <rect x="262" y="138" width="58" height="22" rx="11" fill="#EEF4FF" stroke="#B9CCFF"/>
  <text x="291" y="154" text-anchor="middle" font-size="14" fill="#1F4FD8">Filter</text>

  <rect x="470" y="56" width="204" height="112" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <text x="484" y="84" font-size="16" font-weight="700" fill="#2B2B3A">Click on a chart</text>
  <text x="484" y="108" font-size="14" fill="#5B6472">Filters the clicked chart's</text>
  <text x="484" y="128" font-size="14" fill="#5B6472">Linked components</text>
  <rect x="484" y="138" width="50" height="22" rx="11" fill="#FFF6E5" stroke="#F2C98A"/>
  <text x="509" y="154" text-anchor="middle" font-size="14" fill="#9A5B00">Link</text>

  <!-- Row 2 -->
  <rect x="26" y="180" width="204" height="112" rx="8" fill="#FFFFFF" stroke="#F2C98A"/>
  <text x="40" y="208" font-size="16" font-weight="700" fill="#2B2B3A">Drill down</text>
  <text x="40" y="232" font-size="14" fill="#5B6472">Linked components follow</text>
  <text x="40" y="252" font-size="14" fill="#5B6472">the drilled member</text>
  <rect x="40" y="262" width="50" height="22" rx="11" fill="#FFF6E5" stroke="#F2C98A"/>
  <text x="65" y="278" text-anchor="middle" font-size="14" fill="#9A5B00">Link</text>

  <rect x="248" y="180" width="204" height="112" rx="8" fill="#FFFFFF" stroke="#9CCFA4"/>
  <text x="262" y="208" font-size="16" font-weight="700" fill="#2B2B3A">Drill-through or URL</text>
  <text x="262" y="232" font-size="14" fill="#5B6472">Values passed in when</text>
  <text x="262" y="252" font-size="14" fill="#5B6472">the report opens</text>
  <rect x="262" y="262" width="84" height="22" rx="11" fill="#EAF6EC" stroke="#9CCFA4"/>
  <text x="304" y="278" text-anchor="middle" font-size="14" fill="#2E7D32">Passed in</text>

  <rect x="470" y="180" width="204" height="112" rx="8" fill="#FFFFFF" stroke="#C9BBF2" stroke-dasharray="6 4"/>
  <text x="484" y="208" font-size="16" font-weight="700" fill="#2B2B3A">Parameter</text>
  <text x="484" y="232" font-size="14" fill="#5B6472">No condition; components</text>
  <text x="484" y="252" font-size="14" fill="#5B6472">that use it re-query</text>
  <rect x="484" y="262" width="88" height="22" rx="11" fill="#F3EFFF" stroke="#C9BBF2"/>
  <text x="528" y="278" text-anchor="middle" font-size="14" fill="#5B3FBF">Not listed</text>

  <!-- Lane 2: the component query -->
  <rect x="10" y="336" width="680" height="166" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="30" y="366" font-size="18" font-weight="700" fill="#1F4FD8">Component query</text>
  <text x="30" y="392" font-size="15" fill="#2B2B3A">Every condition applies: a row must pass all of them (AND).</text>
  <text x="30" y="414" font-size="15" fill="#2B2B3A">Conditions on the same field narrow each other; none replaces another.</text>

  <rect x="30" y="428" width="250" height="58" rx="8" fill="#FFFFFF" stroke="#B4BAC4"/>
  <text x="44" y="450" font-size="14" font-weight="700" fill="#3B4252">Own</text>
  <text x="44" y="474" font-size="14" fill="#2B2B3A">Region is East China, South China</text>
  <text x="290" y="463" font-size="18" font-weight="700" fill="#3B4252">+</text>
  <rect x="308" y="428" width="250" height="58" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="322" y="450" font-size="14" font-weight="700" fill="#1F4FD8">Filter</text>
  <text x="322" y="474" font-size="14" fill="#2B2B3A">Region is East China, North China</text>
  <text x="566" y="463" font-size="18" font-weight="700" fill="#3B4252">=</text>
  <rect x="584" y="428" width="90" height="58" rx="8" fill="#FFFFFF" stroke="#1F4FD8" stroke-width="1.5"/>
  <text x="629" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#1F4FD8">Shows</text>
  <text x="629" y="474" text-anchor="middle" font-size="14" fill="#2B2B3A">East China</text>

  <!-- Lane 3: the Conditions list -->
  <rect x="10" y="532" width="680" height="366" rx="12" fill="#F5F6F8" stroke="#D5D9E0" stroke-width="1.5"/>
  <text x="30" y="562" font-size="18" font-weight="700" fill="#3B4252">Conditions button (funnel with a count)</text>

  <rect x="30" y="578" width="330" height="304" rx="8" fill="#FFFFFF" stroke="#B4BAC4"/>
  <text x="46" y="606" font-size="15" font-weight="700" fill="#2B2B3A">Conditions applied to this component</text>
  <text x="46" y="636" font-size="14" font-weight="700" fill="#9A5B00">Link</text>
  <text x="46" y="660" font-size="14" fill="#2B2B3A">Region is East China</text>
  <rect x="290" y="644" width="54" height="24" rx="6" fill="#FFFFFF" stroke="#B4BAC4"/>
  <text x="317" y="661" text-anchor="middle" font-size="14" fill="#3B4252">Clear</text>
  <text x="46" y="692" font-size="14" font-weight="700" fill="#1F4FD8">Filter</text>
  <text x="46" y="716" font-size="14" fill="#2B2B3A">Channel is Online</text>
  <text x="46" y="748" font-size="14" font-weight="700" fill="#2E7D32">Passed in</text>
  <text x="46" y="772" font-size="14" fill="#2B2B3A">Year is 2026</text>
  <text x="46" y="804" font-size="14" font-weight="700" fill="#3B4252">Own</text>
  <text x="46" y="828" font-size="14" fill="#2B2B3A">Store is not Outlet</text>
  <line x1="30" y1="842" x2="360" y2="842" stroke="#E2E5EA"/>
  <rect x="236" y="850" width="108" height="24" rx="6" fill="#FFFFFF" stroke="#B4BAC4"/>
  <text x="290" y="867" text-anchor="middle" font-size="14" fill="#3B4252">Clear all links</text>

  <text x="384" y="606" font-size="14" fill="#2B2B3A">Groups always appear in this order.</text>
  <text x="384" y="636" font-size="14" fill="#2B2B3A">Hover a row for the full condition</text>
  <text x="384" y="656" font-size="14" fill="#2B2B3A">and where it comes from.</text>
  <text x="384" y="692" font-size="14" fill="#2B2B3A">Clear removes one chart click.</text>
  <text x="384" y="712" font-size="14" fill="#2B2B3A">Links made by drilling have no Clear.</text>
  <text x="384" y="748" font-size="14" fill="#2B2B3A">Not listed: parameters, and the</text>
  <text x="384" y="768" font-size="14" fill="#2B2B3A">drill-down of the chart itself,</text>
  <text x="384" y="788" font-size="14" fill="#2B2B3A">which its drill path shows.</text>

  <!-- Arrows are drawn after the lanes so the lane backgrounds do not cover them -->
  <line x1="350" y1="306" x2="350" y2="333" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="362" y="325" font-size="14" font-weight="700" fill="#3B4252">all combined with AND</text>
  <line x1="350" y1="502" x2="350" y2="529" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="362" y="521" font-size="14" font-weight="700" fill="#3B4252">listed by source</text>
</svg>
