<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Three ways to compare the same values</title><desc id="desc">Illustrative data: Group A has 60 online and 40 store sales; Group B has 120 online and 80 store sales. Clustered charts compare values, stacked charts show totals, and 100% stacked charts show equal composition.</desc><rect width="1200" height="480" rx="16" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#203047"><text x="36" y="46" font-size="28" fill="#132238" font-weight="700">Same data. Three different questions.</text><text x="36" y="78" font-size="16" fill="#5b6b80" font-weight="400">Illustrative values — not a product screenshot</text><rect x="790" y="34" width="16" height="16" rx="3" fill="#3478dd"/><text x="814" y="49" font-size="16" fill="#203047" font-weight="400">Online</text><rect x="923" y="34" width="16" height="16" rx="3" fill="#e49b32"/><text x="947" y="49" font-size="16" fill="#203047" font-weight="400">Store</text><rect x="28" y="105" width="374" height="345" rx="3" fill="#fff"/><text x="48" y="139" font-size="23" fill="#132238" font-weight="700">Clustered</text><text x="48" y="167" font-size="17" fill="#5b6b80" font-weight="400">Compare individual values</text><path d="M58 365 H370" stroke="#bcc8d8"/><rect x="420" y="105" width="374" height="345" rx="3" fill="#fff"/><text x="440" y="139" font-size="23" fill="#132238" font-weight="700">Stacked</text><text x="440" y="167" font-size="17" fill="#5b6b80" font-weight="400">Compare totals and contributions</text><path d="M450 365 H762" stroke="#bcc8d8"/><rect x="812" y="105" width="374" height="345" rx="3" fill="#fff"/><text x="832" y="139" font-size="23" fill="#132238" font-weight="700">100% stacked</text><text x="832" y="167" font-size="17" fill="#5b6b80" font-weight="400">Compare composition</text><path d="M842 365 H1154" stroke="#bcc8d8"/><rect x="92" y="305" width="40" height="60" rx="3" fill="#3478dd"/><text x="97" y="297" font-size="16" fill="#203047" font-weight="400">60</text><rect x="140" y="325" width="40" height="40" rx="3" fill="#e49b32"/><text x="145" y="317" font-size="16" fill="#203047" font-weight="400">40</text><rect x="244" y="245" width="40" height="120" rx="3" fill="#3478dd"/><text x="249" y="237" font-size="16" fill="#203047" font-weight="400">120</text><rect x="292" y="285" width="40" height="80" rx="3" fill="#e49b32"/><text x="297" y="277" font-size="16" fill="#203047" font-weight="400">80</text><text x="110" y="392" font-size="18" fill="#203047" font-weight="400">A</text><text x="263" y="392" font-size="18" fill="#203047" font-weight="400">B</text><text x="51" y="430" font-size="16" fill="#5b6b80" font-weight="400">Each series shares a zero baseline.</text><rect x="500" y="317" width="58" height="48" rx="3" fill="#3478dd"/><rect x="500" y="285" width="58" height="32" rx="3" fill="#e49b32"/><text x="511" y="275" font-size="16" fill="#203047" font-weight="400">100</text><rect x="657" y="269" width="58" height="96" rx="3" fill="#3478dd"/><rect x="657" y="205" width="58" height="64" rx="3" fill="#e49b32"/><text x="668" y="195" font-size="16" fill="#203047" font-weight="400">200</text><text x="520" y="392" font-size="18" fill="#203047" font-weight="400">A</text><text x="677" y="392" font-size="18" fill="#203047" font-weight="400">B</text><text x="443" y="430" font-size="16" fill="#5b6b80" font-weight="400">B has twice the total of A.</text><rect x="893" y="263" width="58" height="102" rx="3" fill="#3478dd"/><rect x="893" y="195" width="58" height="68" rx="3" fill="#e49b32"/><text x="902" y="311" font-size="16" fill="#fff" font-weight="700">60%</text><text x="902" y="235" font-size="16" fill="#203047" font-weight="700">40%</text><rect x="1050" y="263" width="58" height="102" rx="3" fill="#3478dd"/><rect x="1050" y="195" width="58" height="68" rx="3" fill="#e49b32"/><text x="1059" y="311" font-size="16" fill="#fff" font-weight="700">60%</text><text x="1059" y="235" font-size="16" fill="#203047" font-weight="700">40%</text><text x="913" y="392" font-size="18" fill="#203047" font-weight="400">A</text><text x="1070" y="392" font-size="18" fill="#203047" font-weight="400">B</text><text x="835" y="430" font-size="16" fill="#5b6b80" font-weight="400">Both have the same 60% / 40% mix.</text></g></svg>