<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Which configuration file points to which repository database</title>
  <desc id="desc">The five repository databases hibernate, quartz, jackrabbit, datafor and upload are copied once from the built-in PostgreSQL on port 25432 to your PostgreSQL server with pg_dump and pg_restore. Then every file that names them is changed. In tomcat/conf/server.xml, jdbc/Hibernate points to hibernate, jdbc/Quartz to quartz, jdbc/jackrabbit to jackrabbit, jdbc/datafor_modeler_auth to datafor and jdbc/datafor_repository to upload. postgresql.hibernate.cfg.xml also points to hibernate; jackrabbit/repository.xml and the two workspace.xml files point to jackrabbit; applicationContext-spring-security-jdbc.properties and DATABASE_URL in ai-agent/.env point to datafor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B4252"/>
    </marker>
  </defs>

  <rect width="700" height="660" fill="#FFFFFF"/>

  <!-- Built-in database -->
  <rect x="14" y="12" width="236" height="60" rx="12" fill="#F5F6F8" stroke="#D5D9E0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="30" y="37" font-size="16" font-weight="700" fill="#3B4252">Built-in PostgreSQL :25432</text>
  <text x="30" y="59" font-size="14" fill="#5B6472">keep it until the move is verified</text>

  <!-- server.xml -->
  <rect x="14" y="100" width="216" height="450" rx="12" fill="#EEF4FF" stroke="#B9CCFF" stroke-width="1.5"/>
  <text x="28" y="126" font-size="15" font-weight="700" fill="#1F4FD8">tomcat/conf/server.xml</text>
  <text x="28" y="146" font-size="14" fill="#5B6FB0">JNDI &lt;Resource&gt; entries</text>

  <rect x="26" y="167" width="192" height="36" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="38" y="190" font-size="14" fill="#2B2B3A">jdbc/Hibernate</text>
  <rect x="26" y="237" width="192" height="36" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="38" y="260" font-size="14" fill="#2B2B3A">jdbc/Quartz</text>
  <rect x="26" y="307" width="192" height="36" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="38" y="330" font-size="14" fill="#2B2B3A">jdbc/jackrabbit</text>
  <rect x="26" y="394" width="192" height="36" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="38" y="417" font-size="14" fill="#2B2B3A">jdbc/datafor_modeler_auth</text>
  <rect x="26" y="487" width="192" height="36" rx="8" fill="#FFFFFF" stroke="#B9CCFF"/>
  <text x="38" y="510" font-size="14" fill="#2B2B3A">jdbc/datafor_repository</text>

  <!-- Your PostgreSQL server -->
  <rect x="262" y="100" width="146" height="450" rx="12" fill="#EAF6EC" stroke="#9CCFA4" stroke-width="1.5"/>
  <text x="276" y="126" font-size="15" font-weight="700" fill="#2E7D32">Your PostgreSQL</text>
  <text x="276" y="146" font-size="15" font-weight="700" fill="#2E7D32">server</text>

  <rect x="274" y="160" width="122" height="50" rx="8" fill="#FFFFFF" stroke="#9CCFA4"/>
  <text x="286" y="181" font-size="15" font-weight="700" fill="#2B2B3A">hibernate</text>
  <text x="286" y="201" font-size="14" fill="#5B6472">hibuser</text>
  <rect x="274" y="230" width="122" height="50" rx="8" fill="#FFFFFF" stroke="#9CCFA4"/>
  <text x="286" y="251" font-size="15" font-weight="700" fill="#2B2B3A">quartz</text>
  <text x="286" y="271" font-size="14" fill="#5B6472">pentaho_user</text>
  <rect x="274" y="300" width="122" height="50" rx="8" fill="#FFFFFF" stroke="#9CCFA4"/>
  <text x="286" y="321" font-size="15" font-weight="700" fill="#2B2B3A">jackrabbit</text>
  <text x="286" y="341" font-size="14" fill="#5B6472">jcr_user</text>
  <rect x="274" y="365" width="122" height="95" rx="8" fill="#FFFFFF" stroke="#9CCFA4"/>
  <text x="286" y="404" font-size="15" font-weight="700" fill="#2B2B3A">datafor</text>
  <text x="286" y="424" font-size="14" fill="#5B6472">datafor_owner</text>
  <rect x="274" y="480" width="122" height="50" rx="8" fill="#FFFFFF" stroke="#9CCFA4"/>
  <text x="286" y="501" font-size="15" font-weight="700" fill="#2B2B3A">upload</text>
  <text x="286" y="521" font-size="14" fill="#5B6472">upload</text>

  <!-- Other files -->
  <rect x="440" y="160" width="250" height="50" rx="8" fill="#F5F6F8" stroke="#D5D9E0"/>
  <text x="452" y="181" font-size="14" font-weight="700" fill="#2B2B3A">postgresql.hibernate.cfg.xml</text>
  <text x="452" y="201" font-size="14" fill="#5B6472">in …/system/hibernate/</text>

  <rect x="440" y="282" width="250" height="70" rx="8" fill="#F5F6F8" stroke="#D5D9E0"/>
  <text x="452" y="303" font-size="14" font-weight="700" fill="#2B2B3A">jackrabbit/repository.xml</text>
  <text x="452" y="323" font-size="14" fill="#2B2B3A">and workspace.xml in</text>
  <text x="452" y="343" font-size="14" fill="#5B6472">workspaces/default and /security</text>

  <rect x="440" y="365" width="250" height="50" rx="8" fill="#F5F6F8" stroke="#D5D9E0"/>
  <text x="452" y="386" font-size="14" font-weight="700" fill="#2B2B3A">applicationContext-spring-</text>
  <text x="452" y="406" font-size="14" font-weight="700" fill="#2B2B3A">security-jdbc.properties</text>

  <rect x="440" y="422" width="250" height="38" rx="8" fill="#F5F6F8" stroke="#D5D9E0"/>
  <text x="452" y="446" font-size="14" font-weight="700" fill="#2B2B3A">ai-agent/.env<tspan font-weight="400" fill="#5B6472">  DATABASE_URL</tspan></text>

  <!-- Arrows are drawn after the boxes -->
  <path d="M250,42 H335 V97" fill="none" stroke="#3B4252" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="345" y="58" font-size="14" fill="#5B6472">copy once: pg_dump, then pg_restore</text>

  <line x1="218" y1="185" x2="271" y2="185" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="218" y1="255" x2="271" y2="255" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="218" y1="325" x2="271" y2="325" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="218" y1="412" x2="271" y2="412" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="218" y1="505" x2="271" y2="505" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="440" y1="185" x2="399" y2="185" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="320" x2="399" y2="320" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="390" x2="399" y2="390" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="441" x2="399" y2="441" stroke="#3B4252" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="14" y="584" font-size="14" fill="#5B6472">Solid arrows: in each file, replace localhost:25432 or 127.0.0.1:25432 with your</text>
  <text x="14" y="604" font-size="14" fill="#5B6472">server's host and port, and set the account and password. A file you miss keeps</text>
  <text x="14" y="624" font-size="14" fill="#5B6472">using the built-in database, which start-server still starts. An update package</text>
  <text x="14" y="644" font-size="14" fill="#5B6472">replaces server.xml, so reapply its five entries after every update.</text>
</svg>
